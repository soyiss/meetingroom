<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>myreservation</title>

    <style>

        body{
            font-family: Arial, sans-serif;
            background:#f5f5f5;
            margin:40px;
        }

        h1{
            color:#333;
            margin-bottom:20px;
        }

        table{
            width:800px;
            border-collapse:collapse;
            background:white;
            box-shadow:0 2px 8px rgba(0,0,0,0.1);
            margin-bottom:20px;
        }

        th{
            background:#4e73df;
            color:white;
            padding:12px;
        }

        td{
            border:1px solid #ddd;
            padding:12px;
            text-align:center;
        }

        tr:nth-child(even){
            background:#f8f9fa;
        }

        tr:hover{
            background:#eef3ff;
        }

        a{
            text-decoration:none;
            color:#4e73df;
            font-weight:bold;
            margin-right:10px;
        }

        a:hover{
            text-decoration:underline;
        }

    </style>

</head>
<body>

<h1>내 예약현황</h1>
<div th:if="${message}"
     style="color:green;">
    <p th:text="${message}"></p>
</div>
<table>

    <tr>
        <th>회의실</th>
        <th>예약일</th>
        <th>시작시간</th>
        <th>종료시간</th>
        <th>상태</th>
        <th>수정</th>
        <th>삭제</th>
    </tr>

    <tr th:each="r : ${reservations}">
        <td th:text="${r.roomName}"></td>
        <td th:text="${r.reserveDate}"></td>
        <td th:text="${r.startTime}"></td>
        <td th:text="${r.endTime}"></td>
        <td th:text="${r.status}"></td>

        <td>
            <a th:href="@{/reservation/update/{id}(id=${r.id})}">
                수정
            </a>
        </td>

        <td>
            <a th:href="@{/reservation/delete/{id}(id=${r.id})}"
               onclick="return confirm('정말 예약을 삭제하시겠습니까?');">
                삭제
            </a>
        </td>

    </tr>

</table>

<a href="/">메인으로</a>

</body>
</html>
