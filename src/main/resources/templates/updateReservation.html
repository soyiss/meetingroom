<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>예약 수정</title>

    <style>

        body{
            font-family: Arial, sans-serif;
            background:#f5f5f5;
            margin:40px;
        }

        h1,h2{
            color:#333;
        }

        table{
            width:550px;
            border-collapse:collapse;
            background:white;
            margin-bottom:20px;
            box-shadow:0 2px 8px rgba(0,0,0,0.1);
        }

        th{
            background:#4e73df;
            color:white;
            padding:12px;
        }

        td{
            border:1px solid #ddd;
            padding:12px;
            text-align:center;
        }

        tr:nth-child(even){
            background:#f8f9fa;
        }

        form{
            background:white;
            width:550px;
            padding:20px;
            box-shadow:0 2px 8px rgba(0,0,0,0.1);
            margin-bottom:30px;
        }

        input{
            padding:8px;
        }

        button{
            padding:8px 18px;
            margin-right:10px;
            cursor:pointer;
        }

        a{
            text-decoration:none;
            color:#4e73df;
            font-weight:bold;
            margin-right:15px;
        }

        a:hover{
            text-decoration:underline;
        }

        .error{
            color:red;
            margin-bottom:15px;
        }

    </style>

</head>
<body>

<h1>예약 수정</h1>

<!-- 중복예약 등 오류메시지 -->
<div th:if="${error}" class="error">
    <p th:text="${error}"></p>
</div>

<form action="/reservation/update" method="post">

    <!-- 수정할 예약번호 -->
    <input type="hidden" name="id" th:value="${reservation.id}">

    <!-- 회의실 번호 -->
    <input type="hidden" name="roomId" th:value="${reservation.roomId}">

    <!-- 예약자 번호 -->
    <input type="hidden" name="userId" th:value="${reservation.userId}">

    <!-- 예약상태 -->
    <input type="hidden" name="status" th:value="${reservation.status}">

    <table>

        <tr>
            <th>회의실 이름</th>
            <td th:text="${reservation.roomName}"></td>
        </tr>

        <tr>
            <th>예약 날짜</th>
            <td>
                <input type="date"
                       id="reserveDate"
                       name="reserveDate"
                       th:value="${reservation.reserveDate}"
                       required>
            </td>
        </tr>

        <tr>
            <th>시작 시간</th>
            <td>
                <input type="time"
                       name="startTime"
                       th:value="${reservation.startTime}"
                       required>
            </td>
        </tr>

        <tr>
            <th>종료 시간</th>
            <td>
                <input type="time"
                       name="endTime"
                       th:value="${reservation.endTime}"
                       required>
            </td>
        </tr>

    </table>

    <button type="submit">수정 완료</button>
    <button type="reset">초기화</button>

</form>

<hr>

<h2>예약 현황</h2>

<table>

    <tr>
        <th>예약일</th>
        <th>시작시간</th>
        <th>종료시간</th>
        <th>예약자</th>
    </tr>

    <tr th:each="r : ${reservations}">
        <td th:text="${r.reserveDate}"></td>
        <td th:text="${r.startTime}"></td>
        <td th:text="${r.endTime}"></td>
        <td th:text="${r.username}"></td>
    </tr>

</table>

<a href="/myreservations">내 예약현황</a>
<a href="/">메인으로</a>

<script>

    // 오늘 이전 날짜 선택 불가
    const today = new Date().toISOString().split("T")[0];
    document.getElementById("reserveDate").min = today;

    // 예약 유효성 검사
    const form = document.querySelector("form");

    form.addEventListener("submit", function(e){

        const reserveDate = document.getElementById("reserveDate").value;
        const start = document.querySelector("[name='startTime']").value;
        const end = document.querySelector("[name='endTime']").value;

        // 시작시간 >= 종료시간
        if(start >= end){
            alert("종료시간은 시작시간보다 늦어야 합니다.");
            e.preventDefault();
            return;
        }

        // 오늘인데 현재시간보다 이전 예약 불가
        const now = new Date();
        const currentDate = now.toISOString().split("T")[0];
        const currentTime = now.toTimeString().substring(0,5);

        if(reserveDate === currentDate && start < currentTime){
            alert("현재 시간보다 이전은 예약할 수 없습니다.");
            e.preventDefault();
            return;
        }
    });

</script>

</body>
</html>
