<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>meetingroom</title>

    <style>

        body{
            font-family: Arial, sans-serif;
            background:#f5f5f5;
            margin:40px;
        }

        h1{
            color:#333;
            margin-bottom:20px;
        }

        h3{
            margin-top:30px;
            margin-bottom:10px;
        }

        table{
            width:500px;
            border-collapse:collapse;
            background:white;
            box-shadow:0 2px 8px rgba(0,0,0,0.1);
        }

        th{
            background:#4e73df;
            color:white;
            padding:12px;
        }

        td{
            border:1px solid #ddd;
            padding:12px;
            text-align:center;
        }

        tr:nth-child(even){
            background:#f8f9fa;
        }

        tr:hover{
            background:#eef3ff;
        }

        a{
            text-decoration:none;
            color:#4e73df;
            font-weight:bold;
            margin-right:15px;
        }

        a:hover{
            text-decoration:underline;
        }

    </style>
</head>
<body>
    <h1>회의실 예약시스템 🏦</h1>

    <!-- 세션에 loginMember 가 있으면 로그인 상태로 판단     -->
    <div th:if ="${session.loginMember} !=null">
        <p th:text="${session.loginMember.username}+'님 반갑습니다.'"></p>

        <h3>회의실 목록</h3>
        <table border="3" style="border-collapse: collapse;">
            <tr>
                <th>회의실</th>
                <th>회의실 명</th>
                <th>수용 인원</th>
                <th>예약</th>
            </tr>

            <tr th:each="room : ${rooms}">

                <td>
                    <img th:if="${room.id == 1}"
                         src="/images/room-a.jpg"
                         width="150">

                    <img th:if="${room.id == 2}"
                         src="/images/room-b.jpg"
                         width="150">

                    <img th:if="${room.id == 3}"
                         src="/images/room-c.jpg"
                         width="150">
                </td>

                <td th:text="${room.name}"></td>

                <td th:text="${room.capacity}"></td>

                <td>
                    <a th:href="@{/rooms/{id}(id=${room.id})}">
                        예약
                    </a>
                </td>

            </tr>
        </table>
        <a href="/myreservations">내 예약현황</a>
        <a href="/logout">로그아웃</a>
    </div>

    <!-- unless는 else와 같은 기능으로 thymeleaf에서는 else 대신 unless라는 표기법을 사용한다.   -->
    <div th:unless="${session.loginMember}!=null">
        <a href="/login">로그인</a>
    </div>

</body>
</html>
