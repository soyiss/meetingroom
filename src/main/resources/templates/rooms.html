<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>reservation</title>

    <style>

        body{
            font-family: Arial, sans-serif;
            background:#f5f5f5;
            margin:40px;
        }

        h1,h2{
            color:#333;
        }

        table{
            width:500px;
            border-collapse:collapse;
            background:white;
            margin-bottom:20px;
            box-shadow:0 2px 8px rgba(0,0,0,0.1);
        }

        th{
            background:#4e73df;
            color:white;
            padding:12px;
        }

        td{
            border:1px solid #ddd;
            padding:12px;
            text-align:center;
        }

        tr:nth-child(even){
            background:#f8f9fa;
        }

        form{
            background:white;
            width:500px;
            padding:20px;
            box-shadow:0 2px 8px rgba(0,0,0,0.1);
            margin-bottom:30px;
        }

        label{
            display:inline-block;
            width:90px;
            font-weight:bold;
        }

        input{
            padding:8px;
        }

        button{
            padding:8px 18px;
            margin-right:10px;
            cursor:pointer;
        }

        a{
            text-decoration:none;
            color:#4e73df;
            font-weight:bold;
        }

        a:hover{
            text-decoration:underline;
        }

        .error{
            color:red;
            margin-bottom:15px;
        }

    </style>

</head>
<body>

<h1>회의실 예약</h1>

<div th:if="${error}" class="error">
    <p th:text="${error}"></p>
</div>

<table>

    <tr>
        <th>회의실</th>
        <td th:text="${room.name}"></td>
    </tr>

    <tr>
        <th>수용 인원</th>
        <td th:text="${room.capacity}"></td>
    </tr>

</table>

<form action="/reservation" method="post">

    <!-- 어느 회의실인지 같이 전송 -->
    <input type="hidden" name="roomId" th:value="${room.id}">

    <div>
        <label>예약 날짜</label>
        <input type="date" name="reserveDate" id="reserveDate" required>
    </div>

    <br>

    <div>
        <label>시작 시간</label>
        <input type="time" name="startTime" required>
    </div>

    <br>

    <div>
        <label>종료 시간</label>
        <input type="time" name="endTime" required>
    </div>

    <br>

    <button type="reset">초기화</button>
    <button type="submit">예약하기</button>

</form>

<h2>예약 현황</h2>

<table>

    <tr>
        <th>예약일</th>
        <th>시작</th>
        <th>종료</th>
        <th>예약자</th>
    </tr>

    <tr th:each="r : ${reservations}">
        <td th:text="${r.reserveDate}"></td>
        <td th:text="${r.startTime}"></td>
        <td th:text="${r.endTime}"></td>
        <td th:text="${r.username}"></td>
    </tr>

</table>

<a href="/">메인으로</a>

<script>

    // 오늘 이전 날짜 선택 불가
    const today = new Date().toISOString().split("T")[0];
    document.getElementById("reserveDate").min = today;

    // 예약 유효성 검사
    const form = document.querySelector("form");

    form.addEventListener("submit", function(e){

        const reserveDate = document.getElementById("reserveDate").value;
        const start = document.querySelector("[name='startTime']").value;
        const end = document.querySelector("[name='endTime']").value;

        // 시작시간 >= 종료시간
        if(start >= end){
            alert("종료시간은 시작시간보다 늦어야 합니다.");
            e.preventDefault();
            return;
        }

        // 오늘인데 현재시간보다 이전 예약 불가
        const now = new Date();
        const currentDate = now.toISOString().split("T")[0];
        const currentTime = now.toTimeString().substring(0,5);

        if(reserveDate === currentDate && start < currentTime){
            alert("현재 시간보다 이전은 예약할 수 없습니다.");
            e.preventDefault();
            return;
        }
    });

</script>

</body>
</html>
